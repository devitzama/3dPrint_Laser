<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Explora nuestro catálogo de productos IAS 3dyLaser.">

    <title>Catálogo | IAS 3dyLaser</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- NAVBAR -->

    <header class="navbar">

        <div class="navbar-container">

            <a href="index.html" class="logo">
                <img src="assets/logo-dorado.png" alt="IAS">
            </a>

            <nav class="nav-menu">

                <a href="index.html#inicio">Inicio</a>

                <a href="index.html#servicios">Servicios</a>

                <a href="index.html#proceso">Proceso</a>

                <a href="index.html#contacto">Contacto</a>

            </nav>

        </div>

    </header>


    <!-- CATÁLOGO -->

    <main>

        <section class="products section">

            <div class="section-header">

                <span class="section-tag" id="category-tag">
                    CATÁLOGO
                </span>

                <h2 id="category-title">
                    Nuestros productos
                </h2>

                <p id="category-description">
                    Explora nuestros productos y encuentra lo que buscas.
                </p>

                <br>

                <a href="index.html#servicios"
                   class="btn btn-secondary">
                    ← Volver a servicios
                </a>

            </div>


            <div class="products-grid">

                <!-- Los productos se cargarán automáticamente -->

            </div>

        </section>

    </main>


    <script src="js/app.js"></script>

</body>

</html>
